<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shadow Text — генератор светильников с тенью-надписью</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <aside id="panel">
    <h1>Shadow Text</h1>
    <p class="subtitle">Светильник, проецирующий надпись тенью на стену</p>

    <label class="field">
      <span>Текст</span>
      <input id="text-input" type="text" value="ПРИВЕТ" maxlength="40" autocomplete="off" spellcheck="false">
    </label>

    <label class="field">
      <span>Шрифт</span>
      <select id="font-select"></select>
    </label>

    <div class="row">
      <label class="field">
        <span>Высота букв, мм</span>
        <input id="size-input" type="number" value="40" min="10" max="200" step="1">
      </label>
      <label class="field">
        <span>Толщина, мм</span>
        <input id="depth-input" type="number" value="5" min="1" max="30" step="0.5">
      </label>
    </div>

    <div class="row">
      <label class="field">
        <span>Интервал, мм</span>
        <input id="spacing-input" type="number" value="2" min="-5" max="30" step="0.5">
      </label>
      <label class="field">
        <span>Планка, мм</span>
        <input id="bar-input" type="number" value="4" min="1" max="20" step="0.5">
      </label>
    </div>

    <label class="check">
      <input id="bottom-bar-check" type="checkbox" checked>
      Нижняя планка (печать одной деталью)
    </label>
    <label class="check">
      <input id="frame-check" type="checkbox">
      Полная рамка
    </label>

    <div class="row">
      <label class="field">
        <span>Модель ↔ стена, мм</span>
        <input id="wall-dist-input" type="number" value="100" min="20" max="400" step="5">
      </label>
      <label class="field">
        <span>Лампа ↔ модель, мм</span>
        <input id="lamp-dist-input" type="number" value="130" min="20" max="400" step="5">
      </label>
    </div>

    <button id="export-btn" class="primary">Скачать STL</button>
    <div id="status" class="status"></div>

    <div class="hint">
      Вращение — ЛКМ, масштаб — колесо, панорама — ПКМ.<br>
      Модель печатается плашмя; 1 единица сцены = 1 мм.
    </div>
  </aside>

  <main id="canvas-wrap"></main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
